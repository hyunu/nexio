version: '3.8'

services:
  mysql:
    container_name: nexio-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: qwer1234
      MYSQL_DATABASE: nexio_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: nexio-server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "10008:10008"
    environment:
      - DATABASE_URL=mysql://root:qwer1234@mysql:3306/nexio_db
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=qwer1234
      - DB_NAME=nexio_db
      - PORT=10008
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    container_name: nexio-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mysql_data:
